<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .header h1 {
      font-size: 1.6rem;
      color: #e0e7ff;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #312e81;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
    }

    .btn-logout {
      background: #e11d48;
      color: white;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-logout:hover {
      background: #be123c;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.75rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 1.25rem;
      color: #e2e8f0;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background-color: #0f172a;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 70px;
    }

    .btn {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .auth-toggle {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .auth-toggle a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 1rem;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }

    .task-content {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      flex: 1;
    }

    .task-checkbox {
      margin-top: 0.25rem;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .task-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .task-title.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid #7f1d1d;
      color: #f87171;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1>Task Manager</h1>

    <div id="userHeader" class="user-pill hidden">
      <span id="userEmailLabel">user@example.com</span>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </header>

  <div id="alertBox" class="alert hidden"></div>

  <!-- AUTH -->
  <div id="authSection" class="card">

    <!-- LOGIN -->
    <div id="loginFormContainer">

      <h2>Login to Your Account</h2>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">Email Address</label>

          <input
            type="email"
            id="loginEmail"
            class="form-control"
            required
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>

          <input
            type="password"
            id="loginPassword"
            class="form-control"
            required
            placeholder="Enter your password"
          />
        </div>

        <button type="submit" class="btn">Login</button>

      </form>

      <div class="auth-toggle">
        Don't have an account?
        <a id="showRegisterBtn">Register here</a>
      </div>

    </div>

    <!-- REGISTER -->
    <div id="registerFormContainer" class="hidden">

      <h2>Create New Account</h2>

      <form id="registerForm">

        <div class="form-group">
          <label for="registerEmail">Email Address</label>

          <input
            type="email"
            id="registerEmail"
            class="form-control"
            required
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>

          <input
            type="password"
            id="registerPassword"
            class="form-control"
            required
            placeholder="Create a password"
          />
        </div>

        <button type="submit" class="btn">Register</button>

      </form>

      <div class="auth-toggle">
        Already have an account?
        <a id="showLoginBtn">Login here</a>
      </div>

    </div>

  </div>

  <!-- TASK DASHBOARD -->
  <div id="taskSection" class="hidden">

    <!-- CREATE TASK -->
    <div class="card">

      <h2>Add New Task</h2>

      <form id="createTaskForm">

        <div class="form-group">

          <label for="taskTitle">Task Title *</label>

          <input
            type="text"
            id="taskTitle"
            class="form-control"
            required
            placeholder="What needs to be done?"
          />

        </div>

        <div class="form-group">

          <label for="taskDesc">Description (Optional)</label>

          <textarea
            id="taskDesc"
            class="form-control"
            placeholder="Add additional details..."
          ></textarea>

        </div>

        <button type="submit" class="btn">
          Add Task
        </button>

      </form>

    </div>

    <!-- TASK LIST -->
    <div class="card">

      <h2>Your Tasks</h2>

      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty-state hidden">
        No tasks yet. Create your first task above!
      </div>

    </div>

  </div>

</div>

<script>

  /*
   * IMPORTANT:
   * Your Express server is running on port 5000.
   */
  const API_BASE = "http://localhost:5000";


  // -----------------------------
  // DOM ELEMENTS
  // -----------------------------

  const authSection = document.getElementById("authSection");
  const loginFormContainer = document.getElementById("loginFormContainer");
  const registerFormContainer =
    document.getElementById("registerFormContainer");

  const taskSection = document.getElementById("taskSection");

  const userHeader = document.getElementById("userHeader");
  const userEmailLabel = document.getElementById("userEmailLabel");

  const alertBox = document.getElementById("alertBox");

  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const createTaskForm = document.getElementById("createTaskForm");

  const taskList = document.getElementById("taskList");
  const emptyState = document.getElementById("emptyState");

  const showRegisterBtn =
    document.getElementById("showRegisterBtn");

  const showLoginBtn =
    document.getElementById("showLoginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");


  // -----------------------------
  // ALERT
  // -----------------------------

  function showAlert(message, type = "error") {

    alertBox.textContent = message;

    alertBox.className =
      `alert alert-${type}`;

    alertBox.classList.remove("hidden");

    setTimeout(() => {
      alertBox.classList.add("hidden");
    }, 4000);
  }


  // -----------------------------
  // TOKEN
  // -----------------------------

  function getToken() {
    return localStorage.getItem("token");
  }


  // -----------------------------
  // AUTHENTICATED REQUEST
  // -----------------------------

  async function authFetch(url, options = {}) {

    const token = getToken();

    if (!token) {

      handleLogout("Please log in to continue.");

      return null;
    }

    const headers = {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`,
      ...(options.headers || {})
    };

    try {

      console.log("API Request:", `${API_BASE}${url}`);

      const response = await fetch(
        `${API_BASE}${url}`,
        {
          ...options,
          headers
        }
      );

      console.log(
        "API Response:",
        response.status,
        `${API_BASE}${url}`
      );

      if (response.status === 401) {

        handleLogout(
          "Session expired or unauthorized. Please log in again."
        );

        return null;
      }

      return response;

    } catch (error) {

      console.error("API ERROR:", error);

      showAlert(
        "Network error. Please check backend connection.",
        "error"
      );

      return null;
    }
  }


  // -----------------------------
  // SHOW LOGIN / REGISTER
  // -----------------------------

  function showAuthUI(view = "login") {

    authSection.classList.remove("hidden");

    taskSection.classList.add("hidden");

    userHeader.classList.add("hidden");

    if (view === "register") {

      loginFormContainer.classList.add("hidden");

      registerFormContainer.classList.remove("hidden");

    } else {

      loginFormContainer.classList.remove("hidden");

      registerFormContainer.classList.add("hidden");
    }
  }


  // -----------------------------
  // SHOW DASHBOARD
  // -----------------------------

  function showDashboardUI(email) {

    authSection.classList.add("hidden");

    taskSection.classList.remove("hidden");

    userHeader.classList.remove("hidden");

    userEmailLabel.textContent =
      email || "User";

    loadTasks();
  }


  // -----------------------------
  // LOGOUT
  // -----------------------------

  function handleLogout(message = "") {

    localStorage.removeItem("token");

    localStorage.removeItem("userEmail");

    showAuthUI("login");

    if (message) {

      showAlert(message, "error");
    }
  }


  // -----------------------------
  // SWITCH TO REGISTER
  // -----------------------------

  showRegisterBtn.addEventListener(
    "click",
    () => showAuthUI("register")
  );


  // -----------------------------
  // SWITCH TO LOGIN
  // -----------------------------

  showLoginBtn.addEventListener(
    "click",
    () => showAuthUI("login")
  );


  // -----------------------------
  // LOGOUT BUTTON
  // -----------------------------

  logoutBtn.addEventListener(
    "click",
    () => handleLogout("Logged out successfully.")
  );


  // -----------------------------
  // REGISTER
  // Backend:
  // POST /auth/register
  // -----------------------------

  registerForm.addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("registerEmail")
          .value
          .trim();

      const password =
        document.getElementById("registerPassword")
          .value;

      try {

        const response = await fetch(
          `${API_BASE}/auth/register`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data = await response.json();

        console.log(
          "REGISTER:",
          response.status,
          data
        );

        if (response.ok) {

          showAlert(
            "Registration successful! Please login.",
            "success"
          );

          registerForm.reset();

          showAuthUI("login");

        } else {

          showAlert(
            data.message ||
            data.error ||
            "Registration failed.",
            "error"
          );
        }

      } catch (error) {

        console.error(
          "REGISTER ERROR:",
          error
        );

        showAlert(
          "Failed to connect to the server.",
          "error"
        );
      }
    }
  );


  // -----------------------------
  // LOGIN
  // Backend:
  // POST /auth/login
  // -----------------------------

  loginForm.addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("loginEmail")
          .value
          .trim();

      const password =
        document.getElementById("loginPassword")
          .value;

      try {

        const response = await fetch(
          `${API_BASE}/auth/login`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data = await response.json();

        console.log(
          "LOGIN:",
          response.status,
          data
        );

        if (
          response.ok &&
          data.token
        ) {

          localStorage.setItem(
            "token",
            data.token
          );

          const emailFromServer =
            data.user &&
            data.user.email
              ? data.user.email
              : email;

          localStorage.setItem(
            "userEmail",
            emailFromServer
          );

          loginForm.reset();

          showAlert(
            "Login successful!",
            "success"
          );

          showDashboardUI(
            emailFromServer
          );

        } else {

          showAlert(
            data.message ||
            data.error ||
            "Invalid credentials.",
            "error"
          );
        }

      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );

        showAlert(
          "Failed to connect to the server.",
          "error"
        );
      }
    }
  );


  // -----------------------------
  // GET TASKS
  // Backend:
  // GET /tasks
  // -----------------------------

  async function loadTasks() {

    console.log("Loading tasks...");

    const response =
      await authFetch(
        "/tasks",
        {
          method: "GET"
        }
      );

    if (!response) {
      return;
    }

    if (response.ok) {

      const tasks =
        await response.json();

      console.log(
        "TASKS:",
        tasks
      );

      renderTasks(tasks);

    } else {

      const data =
        await response.json()
          .catch(() => ({}));

      showAlert(
        data.message ||
        data.error ||
        "Failed to load tasks.",
        "error"
      );
    }
  }


  // -----------------------------
  // RENDER TASKS
  // -----------------------------

  function renderTasks(tasks) {

    taskList.innerHTML = "";

    if (
      !tasks ||
      tasks.length === 0
    ) {

      emptyState.classList.remove(
        "hidden"
      );

      return;
    }

    emptyState.classList.add(
      "hidden"
    );

    tasks.forEach(
      (task) => {

        const li =
          document.createElement("li");

        li.className =
          "task-item";

        li.innerHTML = `

          <div class="task-content">

            <input
              type="checkbox"
              class="task-checkbox"
              ${task.completed ? "checked" : ""}
              onchange="toggleTask(
                '${task._id}',
                ${task.completed}
              )"
            />

            <div>

              <div
                class="task-title ${
                  task.completed
                    ? "completed"
                    : ""
                }"
              >
                ${escapeHtml(task.title)}
              </div>

              ${
                task.description
                  ? `
                    <div class="task-desc">
                      ${escapeHtml(
                        task.description
                      )}
                    </div>
                  `
                  : ""
              }

            </div>

          </div>

          <div class="task-actions">

            <button
              class="btn-delete"
              onclick="deleteTask('${task._id}')"
            >
              Delete
            </button>

          </div>

        `;

        taskList.appendChild(li);
      }
    );
  }


  // -----------------------------
  // CREATE TASK
  // Backend:
  // POST /tasks
  // -----------------------------

  createTaskForm.addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();

      const title =
        document.getElementById("taskTitle")
          .value
          .trim();

      const description =
        document.getElementById("taskDesc")
          .value
          .trim();

      if (!title) {

        showAlert(
          "Task title is required.",
          "error"
        );

        return;
      }

      console.log(
        "Creating task:",
        {
          title,
          description
        }
      );

      const response =
        await authFetch(
          "/tasks",
          {
            method: "POST",

            body: JSON.stringify({
              title,
              description,
              completed: false
            })
          }
        );

      if (!response) {
        return;
      }

      const data =
        await response.json()
          .catch(() => ({}));

      console.log(
        "CREATE TASK RESPONSE:",
        response.status,
        data
      );

      if (response.ok) {

        createTaskForm.reset();

        showAlert(
          "Task created successfully!",
          "success"
        );

        await loadTasks();

      } else {

        showAlert(
          data.message ||
          data.error ||
          "Failed to create task.",
          "error"
        );
      }
    }
  );


  // -----------------------------
  // UPDATE TASK
  // Backend:
  // PUT /tasks/:id
  // -----------------------------

  window.toggleTask =
    async function (
      id,
      currentStatus
    ) {

      const response =
        await authFetch(
          `/tasks/${id}`,
          {
            method: "PUT",

            body: JSON.stringify({
              completed:
                !currentStatus
            })
          }
        );

      if (!response) {
        return;
      }

      if (response.ok) {

        showAlert(
          "Task updated successfully!",
          "success"
        );

        await loadTasks();

      } else {

        const data =
          await response.json()
            .catch(() => ({}));

        showAlert(
          data.message ||
          data.error ||
          "Failed to update task.",
          "error"
        );
      }
    };


  // -----------------------------
  // DELETE TASK
  // Backend:
  // DELETE /tasks/:id
  // -----------------------------

  window.deleteTask =
    async function (id) {

      const response =
        await authFetch(
          `/tasks/${id}`,
          {
            method: "DELETE"
          }
        );

      if (!response) {
        return;
      }

      if (response.ok) {

        showAlert(
          "Task deleted successfully!",
          "success"
        );

        await loadTasks();

      } else {

        const data =
          await response.json()
            .catch(() => ({}));

        showAlert(
          data.message ||
          data.error ||
          "Failed to delete task.",
          "error"
        );
      }
    };


  // -----------------------------
  // ESCAPE HTML
  // -----------------------------

  function escapeHtml(text) {

    if (!text) {
      return "";
    }

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  // -----------------------------
  // CHECK EXISTING SESSION
  // Backend:
  // GET /auth/me
  // -----------------------------

  window.addEventListener(
    "DOMContentLoaded",
    async () => {

      const token =
        getToken();

      if (token) {

        const response =
          await authFetch(
            "/auth/me",
            {
              method: "GET"
            }
          );

        if (
          response &&
          response.ok
        ) {

          const data =
            await response.json();

          const email =
            data.user &&
            data.user.email
              ? data.user.email
              : localStorage.getItem(
                  "userEmail"
                );

          showDashboardUI(
            email
          );

        } else {

          handleLogout();
        }

      } else {

        showAuthUI("login");
      }
    }
  );

</script>

</body>
</html>
```
