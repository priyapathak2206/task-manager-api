services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/taskmanager
      JWT_SECRET: task_manager_docker_secret
      JWT_EXPIRES_IN: 1h
      PORT: 5000
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: